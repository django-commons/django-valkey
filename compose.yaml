

---

services:

  valkey:
    image: valkey/valkey:9.1
    container_name: valkey-standalone
    ports:
      - 6379:6379
    profiles:
      - standalone
      - sentinel
      - replica
      - all
    command: valkey-server --save ""
    healthcheck:
      test: valkey-cli ping
      interval: 5s
      timeout: 5s
      retries: 5

  valkey-cluster:
    # One container running all six nodes; see dockers/cluster.sh for why.
    image: valkey/valkey:9.1
    container_name: valkey-cluster
    command: ["sh", "/cluster.sh"]
    ports:
      - "7000-7005:7000-7005"
    volumes:
      - "./dockers/cluster.sh:/cluster.sh:ro"
    profiles:
      - cluster
      - all
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -p 7000 cluster info | grep -q cluster_state:ok"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  sentinel:
    image: valkey/valkey:9.1
    container_name: valkey-sentinel
    depends_on:
      valkey:
        condition: service_healthy

    entrypoint: "/usr/local/bin/valkey-sentinel /valkey.conf --port 26379"
    ports:
      - 26379:26379
    volumes:
      - "./dockers/sentinel.conf:/valkey.conf"
    profiles:
      - sentinel
      - all

    healthcheck:
      test: valkey-cli -p 26379 ping
      interval: 5s
      timeout: 5s
      retries: 5
